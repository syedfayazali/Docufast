<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DocuFast India — dashboard</title>
<link rel="icon" type="image/png" href="/logo-icon.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="brand-band">
  <div class="wrap" style="padding:0 20px;display:flex;align-items:center;justify-content:space-between;">
    <img src="/logo.png" alt="DocuFast India" style="height:56px;display:block;">
    <span style="font-size:12px;color:var(--slate);font-weight:600;background:var(--navy-tint);padding:4px 12px;border-radius:20px;">Shop Dashboard</span>
  </div>
</div>
<div class="wrap">
  <div class="field" style="margin-top:20px;">
    <label for="ownerKey">Owner key (needed to retry failed prints)</label>
    <input type="password" id="ownerKey" placeholder="Paste your AGENT_KEY here">
  </div>
  <div class="kpi-row">
    <div class="kpi"><div class="num" id="kpiJobs">0</div><div class="lbl">Total jobs</div></div>
    <div class="kpi"><div class="num" id="kpiPrinted">0</div><div class="lbl">Printed</div></div>
    <div class="kpi"><div class="num" id="kpiRevenue">₹0</div><div class="lbl">Revenue</div></div>
  </div>
  <div class="card">
    <table class="admin-table">
      <thead><tr><th>Code</th><th>File</th><th>Pages×copies</th><th>Amount</th><th>Status</th><th></th></tr></thead>
      <tbody id="jobRows"></tbody>
    </table>
  </div>
  <p style="margin-top:16px;"><a class="nav-link" href="/">← Back to upload</a></p>
</div>
<script src="/admin.js"></script>
</body>
</html>
