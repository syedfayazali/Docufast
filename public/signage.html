<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DocuFast India — scan to print</title>
<link rel="icon" type="image/png" href="/logo-icon.png">
<link rel="stylesheet" href="/styles.css">
<style>
  .signage-wrap{max-width:420px;margin:0 auto;padding:40px 20px;text-align:center;}
  .signage-wrap h1{font-size:32px;margin-bottom:8px;}
  .signage-wrap .sub{color:var(--slate);font-size:15px;margin-bottom:24px;}
  .shop-badge{display:none;background:var(--navy-tint,#eef1f8);color:var(--navy);font-weight:700;font-size:13px;padding:6px 14px;border-radius:20px;margin-bottom:16px;}
  .qr-box{background:#fff;border:2px solid var(--navy);border-radius:10px;padding:20px;display:inline-block;}
  .qr-box img{width:280px;height:280px;display:block;}
  .url-text{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--slate);margin-top:18px;word-break:break-all;}
  .steps{text-align:left;margin-top:28px;font-size:14px;}
  .steps li{margin-bottom:6px;}
  .err{color:var(--error,#c0392b);font-size:13px;margin-top:12px;display:none;}
  @media print{button.ghost{display:none;}}
</style>
</head>
<body>
<div class="signage-wrap">
  <img src="/logo.png" alt="DocuFast India" style="height:60px;display:block;margin:0 auto 8px;">
  <div class="shop-badge" id="shopBadge"></div>
  <h1>Scan to print</h1>
  <div class="sub">Upload from your phone, pay, and we print it for you right here.</div>
  <div class="qr-box"><img id="qrImg" alt="QR code" src=""></div>
  <div class="url-text" id="urlText">Loading…</div>
  <div class="err" id="errText"></div>
  <ol class="steps">
    <li>Scan the code with your phone camera</li>
    <li>Upload your file and choose print options</li>
    <li>Pay with UPI or card via Razorpay</li>
    <li>Collect your printout from the counter</li>
  </ol>
  <button class="ghost" onclick="window.print()" style="margin-top:20px;">Print this poster</button>
</div>
<script>
(async()=>{
  // A shop opens this page as /signage.html?shop=<their-slug> so the QR code
  // (and the link it encodes) is unique to them — jobs scanned from it carry
  // that shop's id, instead of falling back to the shared, unrouted link.
  const shopSlug = new URLSearchParams(location.search).get('shop');

  const res = await fetch('/api/config');
  const { baseUrl } = await res.json();

  let targetUrl = baseUrl;

  if (shopSlug) {
    targetUrl = `${baseUrl}/?shop=${encodeURIComponent(shopSlug)}`;
    try {
      const shopRes = await fetch(`/api/shops/by-slug/${encodeURIComponent(shopSlug)}`);
      if (shopRes.ok) {
        const shop = await shopRes.json();
        const badge = document.getElementById('shopBadge');
        badge.textContent = shop.name + (shop.city ? ` · ${shop.city}` : '');
        badge.style.display = 'inline-block';
      } else {
        document.getElementById('errText').textContent = 'Shop not found — this QR code may not route to a shop.';
        document.getElementById('errText').style.display = 'block';
      }
    } catch {
      // Non-fatal — the QR/link below still works even if the name lookup fails.
    }
  }

  document.getElementById('urlText').textContent = targetUrl;
  document.getElementById('qrImg').src = `https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=${encodeURIComponent(targetUrl)}`;
})();
</script>
</body>
</html>
